name: sql-web-manager

services:
  app:
    build: .
    image: sql-web-manager:latest
    ports:
      - "${SQLWM_PORT:-8080}:80"
    environment:
      # Empty values are ignored and the defaults in config/config.php apply.
      SQLWM_DEFAULT_SERVER: ${SQLWM_DEFAULT_SERVER:-}
      SQLWM_ALLOWED_SERVERS: ${SQLWM_ALLOWED_SERVERS:-}
      SQLWM_ENCRYPT: ${SQLWM_ENCRYPT:-}
      SQLWM_TRUST_SERVER_CERTIFICATE: ${SQLWM_TRUST_SERVER_CERTIFICATE:-}
      SQLWM_MAX_ROWS: ${SQLWM_MAX_ROWS:-}
      SQLWM_EXPORT_MAX_ROWS: ${SQLWM_EXPORT_MAX_ROWS:-}
      SQLWM_CSV_SEPARATOR: ${SQLWM_CSV_SEPARATOR:-}
      SQLWM_QUERY_TIMEOUT: ${SQLWM_QUERY_TIMEOUT:-}
      SQLWM_SESSION_TIMEOUT: ${SQLWM_SESSION_TIMEOUT:-}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Demo SQL Server: docker compose --profile demo up -d
  # On the login screen use server "mssql", user "sa" and the password set in MSSQL_SA_PASSWORD.
  # The password has NO default value: set it in .env (not versioned) before starting the demo profile.
  # SQL Server requires a strong password (8+ characters, 3 of 4: upper case, lower case, digit, symbol).
  mssql:
    profiles: ["demo"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql-data:
