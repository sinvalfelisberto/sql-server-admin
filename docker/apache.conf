ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName localhost
    # Só public/ fica exposto; app/ e config/ ficam fora do document root.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
